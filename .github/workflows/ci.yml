name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fakeroot python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gnome-shell
      - run: python3 -m unittest discover -s tests   # sandboxed apply/undo/reset round-trips
      - run: python3 build.py                        # contrast check for every accent x variant
      - run: ./package.sh
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release/* }
