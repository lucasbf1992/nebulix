# Nebulix — edite aqui ou use `nebulix config set chave=valor` / o app Nebulix
theme = "macos-dark"
accent = "auto"
variant = "dark"
radius = 10
window_buttons = "mac"
topbar = "translucent"
dock = "macos"
dock_position = "bottom"
dock_icon_size = 48
dock_opacity = 65
dock_zoom = "off"
dock_zoom_factor = 160
terminal_opacity = 95
terminal_cursor = "ibeam"
terminal_font = "auto"
terminal_font_size = 11
terminal_padding = "on"
terminal_line_height = 100
terminal_columns = 80
terminal_rows = 24
icons = "whitesur"
font = "auto"
vscode_theme = "keep"
wallpaper = "orbit"
wallpaper_size = "4k"
components = ["gtk", "shell", "terminal", "starship", "fastfetch", "btop", "vscode", "nvim", "wallpaper", "icons"]
