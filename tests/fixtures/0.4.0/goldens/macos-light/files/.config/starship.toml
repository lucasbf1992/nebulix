# Nebulix 0.4.0 — Starship prompt
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
format = """
[](fg:#005DC2)$username[](fg:#005DC2 bg:#005DC2)$directory[](fg:#005DC2 bg:#D30F5A)$git_branch$git_status[](fg:#D30F5A bg:#E8E8ED)$python$nodejs$rust$golang$cmd_duration[](fg:#E8E8ED)
$character"""

[username]
show_always = true
style_user = "bg:#005DC2 fg:#FFFFFF bold"
style_root = "bg:#D70015 fg:#FFFFFF bold"
format = '[ $user ]($style)'

[directory]
style = "bg:#005DC2 fg:#FFFFFF bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#D30F5A fg:#FFFFFF bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#D30F5A fg:#FFFFFF"
format = '[$all_status$ahead_behind ]($style)'

[python]
symbol = " "
style = "bg:#E8E8ED fg:#0A7E8C"
format = '[ $symbol$version ]($style)'
[nodejs]
symbol = " "
style = "bg:#E8E8ED fg:#0A7E8C"
format = '[ $symbol$version ]($style)'
[rust]
symbol = " "
style = "bg:#E8E8ED fg:#0A7E8C"
format = '[ $symbol$version ]($style)'
[golang]
symbol = " "
style = "bg:#E8E8ED fg:#0A7E8C"
format = '[ $symbol$version ]($style)'

[cmd_duration]
min_time = 2000
style = "bg:#E8E8ED fg:#946200"
format = '[ 󰔛 $duration ]($style)'

[character]
success_symbol = "[❯](bold #1F7A33)"
error_symbol = "[❯](bold #D70015)"
